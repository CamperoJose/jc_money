name: Patrimonio diario (autocálculo)

# Programado ~00:17 de Bolivia (GMT-4) = 04:17 UTC, todos los días.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Fecha a cerrar (YYYY-MM-DD). Vacío = ayer."
        required: false
        default: ""

jobs:
  cerrar-dia:
    runs-on: ubuntu-latest
    steps:
      - name: Tipo de cambio del día (BCB)
        continue-on-error: true
        env:
          APP_URL: ${{ secrets.APP_URL }}
          API_BEARER_TOKEN: ${{ secrets.API_BEARER_TOKEN }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$API_BEARER_TOKEN" ]; then echo "Faltan los secrets APP_URL y/o API_BEARER_TOKEN." >&2; exit 1; fi
          URL="$APP_URL/api/jobs/tipo-cambio"
          codigo=$(curl -sS -o tc.json -w "%{http_code}" -X POST "$URL" -H "Authorization: Bearer $API_BEARER_TOKEN")
          echo "HTTP $codigo"; cat tc.json; echo
          if [ "$codigo" -ge 300 ]; then exit 1; fi

      - name: Cierre de patrimonio (ayer)
        env:
          APP_URL: ${{ secrets.APP_URL }}
          API_BEARER_TOKEN: ${{ secrets.API_BEARER_TOKEN }}
          DATE_INPUT: ${{ github.event.inputs.date }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$API_BEARER_TOKEN" ]; then echo "Faltan los secrets APP_URL y/o API_BEARER_TOKEN en el repositorio." >&2; exit 1; fi
          URL="$APP_URL/api/jobs/patrimonio-diario"
          if [ -n "$DATE_INPUT" ]; then URL="$URL?date=$DATE_INPUT"; fi
          codigo=$(curl -sS -o respuesta.json -w "%{http_code}" -X POST "$URL" -H "Authorization: Bearer $API_BEARER_TOKEN")
          echo "HTTP $codigo"; cat respuesta.json; echo
          if [ "$codigo" -ge 300 ]; then exit 1; fi

      - name: Correos (patrimonio + alertas, todos los usuarios)
        continue-on-error: true
        env:
          APP_URL: ${{ secrets.APP_URL }}
          API_BEARER_TOKEN: ${{ secrets.API_BEARER_TOKEN }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$API_BEARER_TOKEN" ]; then echo "Faltan los secrets APP_URL y/o API_BEARER_TOKEN." >&2; exit 1; fi
          URL="$APP_URL/api/jobs/correos-multi"
          codigo=$(curl -sS -o correos.json -w "%{http_code}" -X POST "$URL" -H "Authorization: Bearer $API_BEARER_TOKEN")
          echo "HTTP $codigo"; cat correos.json; echo
          if [ "$codigo" -ge 300 ]; then exit 1; fi
