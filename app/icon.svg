<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="MyMoney">
  <defs>
    <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d17a"/>
      <stop offset="1" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ef0b4"/>
      <stop offset="1" stop-color="#0f5c2e"/>
    </linearGradient>
  </defs>
  <!-- coin body -->
  <circle cx="32" cy="32" r="30" fill="url(#rim)"/>
  <circle cx="32" cy="32" r="27" fill="url(#coin)"/>
  <!-- inner emboss ring -->
  <circle cx="32" cy="32" r="22.5" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5"/>
  <!-- growth arrow (up-right) -->
  <g fill="none" stroke="#ffffff" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="20,40 29,31 35,37 44,24"/>
    <polyline points="44,32 44,24 36,24"/>
  </g>
</svg>
